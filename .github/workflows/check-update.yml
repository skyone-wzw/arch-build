name: Check package updates

on:
  schedule:
    # Every Friday at 21:00 UTC (Saturday 05:00 in UTC+8).
    - cron: "0 21 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-package-updates
  cancel-in-progress: false

jobs:
  check-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Check local and AUR packages
        id: check
        run: uv run --frozen --no-dev arch-check-update

      - name: Create or update pull request
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.failed != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automated/update-packages
          delete-branch: true
          commit-message: "chore: update package versions"
          title: "chore: update package versions"
          body: |
            ${{ steps.check.outputs.summary }}

            ---
            Created automatically by `.github/workflows/check-update.yml`.
            Merging this pull request triggers `.github/workflows/build-packages.yml`.
          add-paths: |
            packages.lock
            local
