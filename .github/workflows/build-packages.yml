name: Build packages

on:
  push:
    branches:
      - main
    paths:
      - "local/**"
      - "packages.toml"
      - "packages.lock"
      - "scripts/**"
      - ".github/workflows/build-packages.yml"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild every package, even if the database is current
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-packages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: archlinux:base-devel
      options: --user root

    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      # actions/checkout needs git, which the base-devel image does not ship.
      - name: Install bootstrap tools
        run: pacman -Syu --noconfirm --needed --noprogressbar git python

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Keep the token out of .git/config: untrusted PKGBUILD code runs in
          # this workspace. The database commit authenticates explicitly.
          persist-credentials: false

      - name: Build and publish packages
        env:
          FORCE_REBUILD: ${{ github.event.inputs.force }}
        run: |
          if [[ "${FORCE_REBUILD}" == "true" ]]; then
            python scripts/build.py --force
          else
            python scripts/build.py
          fi
