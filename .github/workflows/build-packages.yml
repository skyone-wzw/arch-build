name: Build packages

on:
  # Publishing is a write operation, so it only runs automatically when the
  # automated update pull request is merged. Everything else is manual.
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild every package, even if the database is current
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-packages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'automated/update-packages')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: archlinux:base-devel
      options: --user root

    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      # actions/checkout needs git; run full system upgrade once here.
      - name: Install bootstrap tools
        run: pacman -Syu --noconfirm --needed --noprogressbar git

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          # For pull_request events check out the base branch (after merge),
          # never the PR merge ref.
          ref: main
          fetch-depth: 0
          # Keep the token out of .git/config: untrusted PKGBUILD code runs in
          # this workspace. The database commit authenticates explicitly.
          persist-credentials: false

      - name: Setup build environment
        run: bash scripts/setup-builder.sh

      - name: Build and publish packages
        env:
          FORCE_REBUILD: ${{ github.event.inputs.force }}
          UV_LINK_MODE: copy
        run: |
          if [[ "${FORCE_REBUILD}" == "true" ]]; then
            uv run --frozen --no-dev arch-build --force
          else
            uv run --frozen --no-dev arch-build
          fi
